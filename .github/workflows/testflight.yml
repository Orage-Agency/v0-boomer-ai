name: TestFlight (iOS)

on:
  push:
    branches:
      - mobile-native
      - release/testflight-001
    paths:
      - "mobile/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:
    inputs:
      match_readonly:
        description: "Set MATCH_READONLY=true to forbid generating new certs/profiles"
        required: false
        default: "false"
      assign_only:
        description: "Skip build/upload; only assign the latest ASC build to BOOMER AI V1."
        required: false
        default: "false"

concurrency:
  group: testflight-ios
  cancel-in-progress: false

jobs:
  build:
    name: Archive & upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 75

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_DISABLE_COLORS: "1"
      TF_GROUP_ID: 6162d862-da50-4650-b96d-8f55ea851ef5
      MATCH_READONLY: ${{ github.event.inputs.match_readonly || 'false' }}
      ASSIGN_ONLY: ${{ github.event.inputs.assign_only || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        if: env.ASSIGN_ONLY != 'true'
        run: |
          for v in 26.3 26.2 26.1.1 26.0.1 26; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_${v}.app"
              echo "Selected /Applications/Xcode_${v}.app"
              xcodebuild -version
              exit 0
            fi
          done
          echo "::warning::No Xcode 26.x found, using default"
          xcodebuild -version

      - name: Set up Ruby 3.2
        if: env.ASSIGN_ONLY != 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: mobile/ios

      - name: Set up Node 22
        if: env.ASSIGN_ONLY != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS deps
        if: env.ASSIGN_ONLY != 'true'
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Expo prebuild (skip dependencies)
        if: env.ASSIGN_ONLY != 'true'
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install --non-interactive || echo "prebuild skipped (project already prebuilt)"

      - name: Install CocoaPods
        if: env.ASSIGN_ONLY != 'true'
        working-directory: mobile/ios
        run: bundle exec pod install --repo-update

      - name: Materialize ASC API key on disk
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_BASE64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_FILEPATH=$KEY_PATH" >> "$GITHUB_ENV"
          head -1 "$KEY_PATH" | grep -q "BEGIN" || { echo "::error::Decoded ASC key is not a PEM"; exit 1; }
          BYTES=$(wc -c < "$KEY_PATH")
          HASH=$(shasum -a 256 "$KEY_PATH" | awk '{print $1}')
          echo "ASC key on disk: $BYTES bytes, sha256: $HASH"
          echo "Header: $(head -1 "$KEY_PATH"); Footer: $(tail -1 "$KEY_PATH")"
          echo "Expected local sha256: 85a4fc542b583ee7c8ede26f0b57153b7706d71d8bf50d7c913a4da84975dbcd"

      - name: ASC API preflight (catches corrupted secrets before fastlane)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/asc-venv/bin/activate"
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import jwt, time, os, sys, urllib.request
          kid = os.environ["ASC_KEY_ID"]
          iss = os.environ["ASC_ISSUER_ID"]
          with open(os.environ["ASC_KEY_FILEPATH"]) as f: key = f.read()
          now = int(time.time())
          tok = jwt.encode({"iss": iss, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=1",
                                       headers={"Authorization": f"Bearer {tok}"})
          try:
              with urllib.request.urlopen(req) as r:
                  print(f"ASC API preflight: HTTP {r.status}")
                  if r.status != 200:
                      print("::error::ASC API preflight rejected"); sys.exit(1)
          except urllib.error.HTTPError as e:
              print(f"::error::ASC API preflight HTTP {e.code}: {e.read().decode()[:200]}")
              sys.exit(1)
          PY

      - name: fastlane beta
        if: env.ASSIGN_ONLY != 'true'
        working-directory: mobile/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_FILEPATH: ${{ env.ASC_KEY_FILEPATH }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane beta

      - name: Assign build to TestFlight group "BOOMER AI V1"
        if: success()
        working-directory: mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          APP_ID_NUMERIC: "6755741429"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_BASE64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_FILEPATH="$KEY_PATH"

          # Reuse preflight venv if present, else create one.
          VENV_DIR="$RUNNER_TEMP/asc-venv"
          if [ ! -x "$VENV_DIR/bin/python3" ]; then
            python3 -m venv "$VENV_DIR"
            "$VENV_DIR/bin/python3" -m pip install --quiet --upgrade pip
            "$VENV_DIR/bin/python3" -m pip install --quiet pyjwt cryptography
          fi

          "$VENV_DIR/bin/python3" - <<'PY'
          import jwt, json, os, sys, time, urllib.request, urllib.error
          KEY_ID = os.environ["ASC_KEY_ID"]
          ISS = os.environ["ASC_ISSUER_ID"]
          APP_ID = os.environ["APP_ID_NUMERIC"]
          GROUP_ID = os.environ["TF_GROUP_ID"]
          KEY = open(os.environ["ASC_KEY_FILEPATH"]).read()

          def mint():
              now = int(time.time())
              return jwt.encode({"iss": ISS, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                                KEY, algorithm="ES256", headers={"kid": KEY_ID, "typ": "JWT"})

          def call(method, path, body=None):
              url = f"https://api.appstoreconnect.apple.com{path}"
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method,
                                           headers={"Authorization": f"Bearer {mint()}",
                                                    "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")

          # 1) Poll for newest build (up to 10 min).
          build = None
          for i in range(1, 31):
              s, body = call("GET", f"/v1/builds?filter[app]={APP_ID}&sort=-uploadedDate&limit=1")
              if s == 200 and body.get("data"):
                  build = body["data"][0]
                  print(f"Found build #{build['attributes']['version']} (id={build['id']}, state={build['attributes']['processingState']}) on attempt {i}")
                  break
              print(f"Attempt {i}/30 (HTTP {s}): no build yet, waiting 20s")
              if s >= 400:
                  print(" response:", json.dumps(body)[:300])
              time.sleep(20)
          if not build:
              print("::error::No build appeared in ASC after 30 attempts.")
              sys.exit(1)

          BUILD_ID = build["id"]
          BUILD_VERSION = build["attributes"]["version"]

          # 2) Assign to TF group; internal groups auto-assign so 422 with "internal group" → verify membership.
          s, body = call("POST", f"/v1/betaGroups/{GROUP_ID}/relationships/builds",
                         {"data": [{"type": "builds", "id": BUILD_ID}]})
          print("Assignment response:", s, json.dumps(body)[:300])
          assigned = False
          if 200 <= s < 300:
              assigned = True
          elif s == 422 and "internal group" in json.dumps(body).lower():
              # Verify membership
              s2, b2 = call("GET", f"/v1/betaGroups/{GROUP_ID}/builds?limit=200")
              ids = [b["id"] for b in (b2.get("data") or [])] if s2 == 200 else []
              if BUILD_ID in ids:
                  print(f"Build #{BUILD_VERSION} is in TF group BOOMER AI V1 (auto-assigned).")
                  assigned = True
              else:
                  print(f"::error::Build {BUILD_ID} not in group after auto-assign check.")
          if not assigned:
              print(f"::error::Group assignment returned {s}")
              sys.exit(1)
          print(f"Build #{BUILD_VERSION} assigned to TestFlight group BOOMER AI V1.")

          # 3) Best-effort processing state.
          s, body = call("GET", f"/v1/builds/{BUILD_ID}")
          proc = body.get("data", {}).get("attributes", {}).get("processingState", "UNKNOWN")
          print(f"Build #{BUILD_VERSION} processing state: {proc}")
          PY

      - name: Upload IPA artifact
        if: always() && env.ASSIGN_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BoomerAI-ipa
          path: mobile/ios/build/*.ipa
          if-no-files-found: ignore
          retention-days: 14
